[project]
name = "stock-mcp-server"
version = "1.0.0"
description = "FastMCP server for stock analysis with recommendations, Pinecone vector tracking, and automated reporting"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.8.1",
    "yfinance>=0.2.61",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "schedule>=1.2.0",
    "pyyaml>=6.0",
    "pinecone>=8.0.0",
    "sentence-transformers>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
]
